[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "academic-hunter"
dynamic = ["version"]
description = "Automated Systematic Literature Review (SLR) tool — semantic search, topic clustering, novelty detection, and MCP server for agentic integration."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Felipe Nunes", email = "devfelipenunes@gmail.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["SLR", "systematic-review", "literature-review", "embeddings", "MCP", "academic-search", "research-tool"]
dependencies = [
    "pandas>=1.0.0",
    "requests>=2.25.0",
    # mcp 2.0 renamed FastMCP to MCPServer and moved it out of
    # `mcp.server.fastmcp`, which every tool module imports. Without the
    # ceiling a fresh install resolves to 2.x and the MCP layer cannot import
    # at all — the server then exits silently, with no output on stdio.
    "mcp>=1.0.0,<2",
    "chromadb>=1.5.0"
]

[project.optional-dependencies]
rag = ["chromadb>=1.5.0"]
fulltext = [
    "pypdf>=4.0.0",
]
ml = [
    "sentence-transformers>=2.2.0",
    "scikit-learn>=1.0.0",
    "umap-learn>=0.5.0",
    "bertopic>=0.17.0",
    "hdbscan>=0.8.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-xdist>=3.0.0",
    "ruff>=0.11.0",
    "pre-commit>=4.0.0",
]
all = ["academic-hunter[ml]"]

[project.scripts]
academic-mcp = "academic_hunter.interfaces.mcp.server:run_mcp_server"

[project.urls]
Homepage = "https://github.com/devfelipenunes/academic-hunter"
Documentation = "https://devfelipenunes.github.io/academic-hunter"
"Bug Tracker" = "https://github.com/devfelipenunes/academic-hunter/issues"

[tool.hatch.build.targets.sdist]
exclude = [
    "config*.json",
    "!config.example.json",
    ".claude",
    ".gemini",
    ".cursor",
    ".codex",
]

[tool.hatch.version]
path = "src/academic_hunter/__init__.py"

[tool.pyright]
include = ["src"]
extraPaths = ["src"]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests that hit real external APIs (deselect with '-m \"not integration\"')"
]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = '-p no:cacheprovider -m "not integration"'

[tool.ruff]
line-length = 120
# Matches `requires-python` above: it said py312 while the project promises
# 3.10, which let `UP` suggest syntax the floor cannot run.
#
# Note this is *not* the source of the existing UP warnings — measured, they are
# identical under either target (263 UP006, 98 UP035, 56 UP045). Those come from
# the `Dict`/`List`/`Optional` annotations used throughout the codebase, which
# are valid on 3.10 and are a deliberate style, not a version problem.
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"
