name: Tests

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # `dev` brings pytest-asyncio (without it the ~188 async tests never run at
      # all), `ml` brings sentence-transformers — the analysis tests import it and
      # fail with ModuleNotFoundError when it is missing, which is 15 failures
      # measured on a machine that skipped it — and `fulltext` brings pypdf for
      # the full-text step. The same set the Dockerfile, the Makefile and
      # install.py install.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml,fulltext]"

      - name: Run test suite
        run: python -m pytest tests/ -v --tb=short

  mcp-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml,fulltext]"

      - name: Run the real server over stdio
        run: python -m pytest tests/interfaces/mcp/test_server_integration.py -v -m integration

  connectivity:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml,fulltext]"

      - name: Check the external APIs still answer
        run: python -m pytest tests/plugins/test_api_connectivity.py -v -m integration
