name: Tests

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # See the other Python versions even when one fails: the floor is 3.10 and
      # a break there is exactly what this matrix exists to catch.
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # `dev` carries pytest-asyncio, without which pytest does not run the ~188
      # `async def` tests at all — it errors with "async def functions are not
      # natively supported". `ml` carries sentence-transformers, without which
      # any test that patches `sentence_transformers.*` fails at patch time with
      # ModuleNotFoundError, since `patch` has to import the target.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml]"

      - name: Run test suite
        run: python -m pytest tests/ -v --tb=short

      - name: Verify scoring formulas
        if: matrix.python-version == '3.12'
        run: python papers/experiments/verify_scoring.py
